pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.minecraftforge.net/" }
    }
}

plugins {
    // Auto-provisions the JDK-24 toolchain that mergeJars (Forgix) runs on,
    // so the merge works on machines/CI without a local JDK 24 install
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = "OpenTerrainGenerator"

include(
        'common:common-annotation',
        "common:common-util",
        "common:common-customobject",
        "common:common-generator",
        "common:common-core",
        "platforms:forge",
        "platforms:shared",
        "platforms:fabric",
        //"platforms:paper",
)
